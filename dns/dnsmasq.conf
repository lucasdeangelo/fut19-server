# dnsmasq.conf — fut19-edge
# Salve como ./dns/dnsmasq.conf ao lado do docker-compose.fut19-edge.yml

# Não usar o resolv.conf do container; upstream fixo para todo o resto.
# IMPORTANTE: domínios reais da EA (accounts.ea.com, signin.ea.com etc.)
# continuam resolvendo normalmente — o login do EA App/Origin segue vivo.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Log de todas as queries DNS.
# Na primeira vez que abrir o jogo, olhe esse log: ele revela TODOS os
# domínios que o cliente tenta resolver — adicione aqui os que faltarem.
log-queries
log-facility=/var/log/dnsmasq.log

# ---------------------------------------------------------------
# Spoof dos domínios do FUT 19 -> IP DESTE SERVIDOR na sua rede.
# AJUSTE 192.168.0.10 para o IP real da máquina que roda o Docker.
# ---------------------------------------------------------------
address=/utas.external.s2.fut.ea.com/192.168.15.54
address=/utas.s2.fut.ea.com/192.168.15.54
address=/utas.fut.ea.com/192.168.15.54
address=/utas.external.fut.ea.com/192.168.15.54
address=/easo.ea.com/192.168.15.54
